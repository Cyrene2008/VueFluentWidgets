name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        working-directory: packages/vue-fluent-widgets
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Build library
        run: pnpm -C packages/vue-fluent-widgets build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: packages/vue-fluent-widgets
        run: npm publish --registry https://registry.npmjs.org --access public --provenance
