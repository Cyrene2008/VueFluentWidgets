name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        working-directory: packages/vue-fluent-widgets
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Build library
        run: pnpm -C packages/vue-fluent-widgets build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: packages/vue-fluent-widgets
        run: npm publish --registry https://registry.npmjs.org --access public --provenance

      - name: Open version update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: release v${{ inputs.version }}"
          title: "chore: release v${{ inputs.version }}"
          body: |
            The npm publish workflow released `vue-fluent-widgets@${{ inputs.version }}`.

            This pull request records the published package version in the repository.
          branch: "release/v${{ inputs.version }}"
          delete-branch: true
          add-paths: |
            packages/vue-fluent-widgets/package.json
            pnpm-lock.yaml
