name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        working-directory: packages/vue-fluent-widgets
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Scope package name for GitHub Packages
        working-directory: packages/vue-fluent-widgets
        run: |
          node -e "const fs=require('fs');const f='./package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.name='@cyrene2008/vue-fluent-widgets';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Build library
        run: bun --cwd packages/vue-fluent-widgets build

      - name: Run tests
        run: bun run test

      - name: Configure npm for GitHub Packages
        working-directory: packages/vue-fluent-widgets
        run: |
          cat > .npmrc <<'EOF'
          @cyrene2008:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          always-auth=true
          EOF

      - name: Publish to GitHub Packages
        working-directory: packages/vue-fluent-widgets
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
