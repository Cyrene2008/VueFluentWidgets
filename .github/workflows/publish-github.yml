name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@Cyrene2008'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        working-directory: packages/vue-fluent-widgets
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Scope package name for GitHub Packages
        working-directory: packages/vue-fluent-widgets
        run: |
          node -e "const fs=require('fs');const f='./package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.name='@Cyrene2008/vue-fluent-widgets';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Build library
        run: pnpm -C packages/vue-fluent-widgets build

      - name: Run tests
        run: pnpm test

      - name: Publish to GitHub Packages
        working-directory: packages/vue-fluent-widgets
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}